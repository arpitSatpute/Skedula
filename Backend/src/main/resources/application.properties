spring.application.name=Skedula
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/skedula}
spring.datasource.username=${DB_NAME:postgres}
spring.datasource.password=${DB_PASSWORD:0000}
spring.datasource.hikari.maximum-pool-size=5

spring.jpa.hibernate.ddl-auto=update

jwt.secretKey=${JWT_SECRET_KEY}

spring.web.resources.static-locations=classpath:/static/

spring.mail.username=${MAIL_SERVICE_EMAIL}
spring.mail.password=${MAIL_SERVICE_PASSWORD}
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

uploadcare.publicKey=${UPLOADCARE_PUBLIC_KEY}
uploadcare.secretKey=${UPLOADCARE_SECRET_KEY}

razorpay.keyId=${RAZORPAY_KEY_ID}
razorpay.secret.key=${RAZORPAY_KEY_SECRET}

# RazorpayX Test Mode Configuration
razorpayx.keyId=${RAZORPAYX_KEY_ID}
razorpayx.keySecret=${RAZORPAYX_KEY_SECRET}
razorpayx.accountNumber=${RAZORPAYX_ACCOUNT_NUMBER}
razorpayx.webhookSecret=${RAZORPAYX_WEBHOOK_SECRET}
razorpayx.testMode=${RAZORPAYX_TEST_MODE}

# RabbitMQ Message Broker Configuration
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.virtual-host=${RABBITMQ_VIRTUAL_HOST:/}
spring.rabbitmq.ssl.enabled=${RABBITMQ_SSL_ENABLED:false}

rabbitmq.email.queue=skedula.email.queue
rabbitmq.email.exchange=skedula.email.exchange
rabbitmq.email.routingkey=skedula.email.routingkey

# Redis Caching Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.username=${REDIS_USERNAME:default}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED:false}
spring.data.redis.timeout=${REDIS_TIMEOUT:10000ms}
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0
spring.data.redis.lettuce.pool.max-wait=${REDIS_TIMEOUT:10000ms}
redis.cache.enabled=${REDIS_ENABLED:true}
management.health.redis.enabled=false

# GZIP HTTP Response Compression
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml
server.compression.min-response-size=1024


